apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: tracked-service-template
  title: Tracked Service Template
  description: A template that tracks its origin and version using custom annotator actions.
  annotations:
    # 1. Define the current version of the template itself
    backstage.io/template-version: "1.0.4" 
spec:
  owner: user:default/rishabhsvats
  type: service
  
  parameters:
    - title: Component Details
      required:
        - name
      properties:
        name:
          title: Name
          type: string
          description: Unique name for your new component.
        template_version:
          title: Template Version
          type: string
          default: "1.0.1"
          description: The version of the template being used to create this component.

    - title: Repository Location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Fetch Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          repoUrl: ${{ parameters.repoUrl }}

    # 2. Add the scaffolded-from tracking action
    - id: track-origin
      name: Track Origin Template
      action: catalog:scaffolded-from
      # This automatically adds the 'scaffoldedFrom' spec to the generated catalog-info.yaml, 
      # linking back to this template's entityRef.

    # 3. Add the template version tracking action
    - id: track-version
      name: Append Template Version
      action: catalog:template:version
      input:
        annotations:
          # This stamps the resulting entity with the specific version parameter
          backstage.io/template-version: ${{ parameters.template_version }}

    - id: publish
      name: Publish Repository
      action: publish:github
      input:
        description: Scaffolded component ${{ parameters.name }}
        repoUrl: ${{ parameters.repoUrl }}

    - id: register
      name: Register Component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
