  apiVersion: scaffolder.backstage.io/v1beta3
  kind: Template
  metadata:
    name: test-notification-template
    title: Test Notification Template
    description: Minimal template for testing notifications
    annotations:
      backstage.io/template-version: "1.0.0"
    tags:
      - test
  spec:
    owner: user:default/rishabhsvats
    type: service

    parameters:
      - title: Component Details
        required:
          - name
        properties:
          name:
            title: Name
            type: string
            pattern: '^[a-z0-9-]+$'
          description:
            title: Description
            type: string
            default: Test component for notifications
  
    steps:
      - id: template-version-first
        name: Prepare Version Info
        action: catalog:template:version
        input:
          entity:
            apiVersion: backstage.io/v1alpha1
            kind: Component
            metadata:
              name: ${{ parameters.name }}
              description: ${{ parameters.description }}
              tags:
                - test
            spec:
              type: service
              lifecycle: experimental
              owner: user:default/rishabhsvats

      - id: register 
        name: Register Component
        action: catalog:write
        input:
          entity:
            apiVersion: backstage.io/v1alpha1
            kind: Component
            metadata:
              name: ${{ parameters.name }}
              description: ${{ parameters.description }}
              annotations:
                backstage.io/template-version: "1.0.0"
                backstage.io/source-template: template:default/test-notification-template
              tags:
                - test
            spec:
              type: service
              lifecycle: experimental
              owner: user:default/rishabhsvats

    output: 
      links:
        - title: Open Component
          icon: catalog
          entityRef: component:default/${{ parameters.name }}
